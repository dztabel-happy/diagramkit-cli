name: release
on:
  workflow_dispatch:
    inputs:
      core_ref:
        description: Full 40-character private source commit SHA
        required: true
        type: string
      publish:
        description: Publish the archive from a successful rehearsal
        required: true
        type: choice
        default: "false"
        options: ["false", "true"]
      rehearsal_run_id:
        description: Successful rehearsal run ID (required only for publish)
        type: string

permissions:
  contents: read
concurrency:
  group: diagramkit-release
  cancel-in-progress: false
defaults:
  run:
    shell: bash

jobs:
  build:
    if: inputs.publish == 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CORE_SHA: ${{ inputs.core_ref }}
    steps:
      - name: Require an immutable source commit
        run: '[[ "$CORE_SHA" =~ ^[a-f0-9]{40}$ ]]'
      - name: Check out release files
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          path: wrapper
          persist-credentials: false
      - name: Check out private core
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          repository: dztabel-happy/diagramkit-cli-core
          ref: ${{ inputs.core_ref }}
          path: core
          ssh-key: ${{ secrets.CORE_DEPLOY_KEY }}
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "22.16.0"
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Verify the pair and prepare the build
        working-directory: core
        run: |
          test "$(git rev-parse HEAD)" = "$CORE_SHA"
          test "$(git -C ../wrapper rev-parse HEAD)" = "$GITHUB_SHA"
          node scripts/sync-public.mjs --check ../wrapper
          npm ci --no-audit --no-fund >"$RUNNER_TEMP/dependencies.log" 2>&1
          python -m pip install --quiet -r requirements-fonts.txt >"$RUNNER_TEMP/python.log" 2>&1
          python scripts/fonts.py >"$RUNNER_TEMP/fonts.log" 2>&1
          python scripts/fonts.py --check >>"$RUNNER_TEMP/fonts.log" 2>&1
      - name: Build and check the actual tarball
        working-directory: core
        run: |
          python scripts/pack-release.py ../packed >"$RUNNER_TEMP/pack.json" 2>"$RUNNER_TEMP/build.log"
          jq -e --arg core "$CORE_SHA" --arg wrapper "$GITHUB_SHA" \
            '.[0] | select(.name == "@dztabel/diagramkit") | {core:$core, wrapper:$wrapper, name, version, filename, integrity}' \
            "$RUNNER_TEMP/pack.json" > ../packed/candidate.json
          cat ../packed/candidate.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: candidate
          path: |
            packed/*.tgz
            packed/candidate.json
          if-no-files-found: error
          retention-days: 2

  smoke:
    needs: build
    name: Cold install and render on ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel, windows-latest, windows-11-arm, ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "22.16.0"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: candidate
          path: packed
      - name: Install the same tarball, load the skill and draw
        run: |
          (cd packed && node -e 'const m=require("./candidate.json"); if ("sha512-"+require("crypto").createHash("sha512").update(require("fs").readFileSync(m.filename)).digest("base64")!==m.integrity) process.exit(1)')
          mkdir consumer && cd consumer
          npm init -y > /dev/null
          npm install --cache ./npm-cache --registry=https://registry.npmjs.org --no-audit --no-fund ../packed/*.tgz
          npx --no-install diagramkit --version
          npx --no-install diagram-kit --version
          node ../.github/scripts/smoke.mjs
      - name: Exercise the Linux musl native runtime on the same architecture
        if: runner.os == 'Linux'
        run: |
          docker run --rm --workdir /consumer -v "$PWD/packed:/packed:ro" -v "$PWD/.github/scripts:/checks:ro" \
            node:22.16.0-alpine@sha256:41e4389f3d988d2ed55392df4db1420ad048ae53324a8e2b7c6d19508288107e \
            sh -ec 'apk add --no-cache fontconfig >/dev/null; npm init -y >/dev/null; npm install --no-audit --no-fund /packed/*.tgz; node /checks/smoke.mjs'

  rehearse:
    needs: smoke
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "22.16.0"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: candidate
          path: packed
      - name: Check version availability and rehearse publication
        run: |
          version=$(jq -er .version packed/candidate.json)
          curl -fsSL 'https://registry.npmjs.org/@dztabel%2fdiagramkit' | jq -e --arg v "$version" '.versions | has($v) | not'
          npm publish ./packed/*.tgz --access public --dry-run
      - name: Retain the rehearsed archive for promotion
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rehearsed-package
          path: |
            packed/*.tgz
            packed/candidate.json
          if-no-files-found: error
          retention-days: 14

  publish:
    if: inputs.publish == 'true'
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
    env:
      CORE_SHA: ${{ inputs.core_ref }}
      REHEARSAL: ${{ inputs.rehearsal_run_id }}
    steps:
      - name: Require a green manual rehearsal of this workflow at this public commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "$CORE_SHA" =~ ^[a-f0-9]{40}$ && "$REHEARSAL" =~ ^[0-9]+$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$REHEARSAL" |
            jq -e --arg sha "$GITHUB_SHA" --arg repo "$GITHUB_REPOSITORY" \
              '.conclusion == "success" and .event == "workflow_dispatch" and .path == ".github/workflows/release.yml" and .head_sha == $sha and .head_repository.full_name == $repo'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: rehearsed-package
          path: packed
          run-id: ${{ inputs.rehearsal_run_id }}
          github-token: ${{ github.token }}
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "22.16.0"
          registry-url: https://registry.npmjs.org
      - name: Match both commits and check the archive integrity
        working-directory: packed
        run: |
          jq -e --arg core "$CORE_SHA" --arg wrapper "$GITHUB_SHA" \
            '.core == $core and .wrapper == $wrapper and .name == "@dztabel/diagramkit" and .filename == ("dztabel-diagramkit-" + .version + ".tgz")' candidate.json
          node -e 'const m=require("./candidate.json"); if ("sha512-"+require("crypto").createHash("sha512").update(require("fs").readFileSync(m.filename)).digest("base64")!==m.integrity) process.exit(1)'
      - name: Publish the rehearsed tarball
        working-directory: packed
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish "./$(jq -er .filename candidate.json)" --access public --tag latest
      - name: Wait for official latest and verify registry integrity
        working-directory: packed
        timeout-minutes: 16
        run: |
          for attempt in {1..60}; do
            if curl -fsSL 'https://registry.npmjs.org/@dztabel%2fdiagramkit' -o "$RUNNER_TEMP/registry.json" &&
              jq -e --slurpfile m candidate.json '.["dist-tags"].latest == $m[0].version and .versions[$m[0].version].dist.integrity == $m[0].integrity' "$RUNNER_TEMP/registry.json"; then
              exit 0
            fi
            sleep 15
          done
          exit 1
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          path: wrapper
          persist-credentials: false
      - name: Cold install from official npm and render again
        run: |
          mkdir installed && cd installed
          npm init -y > /dev/null
          npm install --cache ./npm-cache --registry=https://registry.npmjs.org --no-audit --no-fund "@dztabel/diagramkit@$(jq -er .version ../packed/candidate.json)"
          node -e 'const m=require("../packed/candidate.json"), p=require("./package-lock.json").packages["node_modules/@dztabel/diagramkit"]; if(p.version!==m.version||p.integrity!==m.integrity)process.exit(1)'
          npx --no-install diagramkit --version
          npx --no-install diagram-kit --version
          node ../wrapper/.github/scripts/smoke.mjs
