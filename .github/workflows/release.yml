# DiagramKit release — runs in the PUBLIC repository so GitHub-hosted runners (macOS and Windows included) are free.
#
# Security model (do not weaken):
# - The private source is checked out with a read-only deploy key (CORE_DEPLOY_KEY). No copy of it ever lands in this
#   repository's history, and no step uploads it.
# - Logs here are world-readable. This workflow therefore runs NO unit tests and prints NO source: the full suite and
#   the acceptance runs are done on the maintainer's machine BEFORE this workflow is dispatched (the private
#   repository's docs/release-runbook.md). Steps here print versions, file names, sizes and the results of smoke
#   builds only; the boundary gate runs with --quiet and names files, never their contents.
# - The only artefact handed between jobs is the packed public package, after the boundary gate has read it.
# - Actions are pinned to full commit SHAs. The trigger is workflow_dispatch only (publish defaults to "false"): a
#   fork's pull request can neither start it nor read its secrets.
name: release

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the package to npm after every gate passes
        required: true
        default: "false"
        type: choice
        options: ["false", "true"]
      core_ref:
        description: Exact diagramkit-cli-core commit, tag, or branch to build
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: diagramkit-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and gate the public package
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      version: ${{ steps.pack.outputs.version }}
      sha: ${{ steps.resolve.outputs.sha }}
    steps:
      - name: Checkout private core
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          repository: dztabel-happy/diagramkit-cli-core
          ref: ${{ inputs.core_ref }}
          ssh-key: ${{ secrets.CORE_DEPLOY_KEY }}
          persist-credentials: false
      - name: Resolve immutable core commit
        id: resolve
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Checkout public repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          path: wrapper
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "22.16.0"
      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Install build dependencies
        shell: bash
        run: |
          npm ci --no-audit --no-fund > /dev/null
          python -m pip install --quiet -r requirements-fonts.txt
      - name: Supply the bundled fonts
        shell: bash
        run: python scripts/fonts.py > /dev/null && python scripts/fonts.py --check > /dev/null && echo "fonts supplied"
      - name: Build the public package
        shell: bash
        run: node scripts/build-release.mjs --out release --readme wrapper/README.md
      - name: Boundary gate
        shell: bash
        run: node scripts/check-release-boundary.mjs release --quiet
      - name: Pack
        id: pack
        shell: bash
        run: |
          mkdir -p packed
          (cd release && npm pack --pack-destination ../packed > /dev/null)
          version="$(node -p "require('./release/package.json').version")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          ls -l packed
          shasum -a 256 packed/*.tgz
      - name: Hand the packed package to the next jobs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: public-package
          path: packed/*.tgz
          retention-days: 1
          if-no-files-found: error

  smoke:
    name: Install and draw on ${{ matrix.runner }}
    needs: build
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-14, windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "22.16.0"
      - name: Collect the packed package
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: public-package
          path: packed
      - name: Cold install
        shell: bash
        run: |
          mkdir consumer && cd consumer
          npm init -y > /dev/null
          npm install --no-audit --no-fund ../packed/*.tgz > /dev/null
          npx --no-install diagramkit --version
      - name: Doctor
        shell: bash
        working-directory: consumer
        env:
          DIAGRAMKIT_NO_SETUP: "1"
        run: npx --no-install diagramkit doctor > doctor.json && node -e "const d=require('./doctor.json');if(!d.ok)process.exit(1);console.log(d.version,d.platform,d.arch,'word page:',d.font.wordPage)"
      - name: Draw a figure in every format
        shell: bash
        working-directory: consumer
        env:
          DIAGRAMKIT_NO_SETUP: "1"
        run: |
          npx --no-install diagramkit example performance-payment --out spec.json > /dev/null
          npx --no-install diagramkit validate spec.json --strict > /dev/null
          npx --no-install diagramkit build spec.json --out figure --format all --strict > result.json
          node -e "const r=require('./result.json');if(!r.ok||r.quality.score<90)process.exit(1);console.log('score',r.quality.score,r.figure.widthMm+' x '+r.figure.heightMm+' mm',r.figure.textPt+' pt')"
          test -s figure/diagram.png && test -s figure/diagram.svg && test -s figure/diagram.pdf
          npx --no-install diagramkit verify figure > /dev/null && echo "bundle verified"
      - name: Install the skill from the package
        shell: bash
        working-directory: consumer
        run: npx --no-install diagramkit sync-skill --out ./skill > /dev/null && test -s skill/SKILL.md && echo "skill installed"

  publish:
    name: Publish (or rehearse)
    needs: [build, smoke]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "22.16.0"
          registry-url: https://registry.npmjs.org
      - name: Collect the packed package
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: public-package
          path: packed
      - name: The version must be new
        shell: bash
        run: |
          version="${{ needs.build.outputs.version }}"
          if npm view "@dztabel/diagramkit@$version" version > /dev/null 2>&1; then
            echo "@dztabel/diagramkit@$version is already on npm: a published version is immutable — bump the version." >&2
            exit 1
          fi
          echo "@dztabel/diagramkit@$version from core ${{ needs.build.outputs.sha }}"
      - name: Publish
        if: inputs.publish == 'true'
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish ./packed/*.tgz --access public
      - name: Rehearse publish
        if: inputs.publish != 'true'
        shell: bash
        run: npm publish ./packed/*.tgz --access public --dry-run
