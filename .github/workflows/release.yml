name: release
on:
  workflow_dispatch:
    inputs:
      core_ref:
        description: Full 40-character private source commit SHA
        required: true
        type: string
      publish:
        description: "false = rehearse, true = publish, verify = recheck the published archive"
        required: true
        type: choice
        default: "false"
        options: ["false", "true", "verify"]
      platform_integrities:
        description: JSON map of the three private rehearsal platform SHA-512 values (required for rehearsal)
        type: string
      rehearsal_run_id:
        description: Successful rehearsal run ID (required for publish or verify)
        type: string

permissions:
  contents: read
concurrency:
  group: diagramkit-release
  cancel-in-progress: false
defaults:
  run:
    shell: bash

jobs:
  build:
    if: inputs.publish == 'false'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CORE_SHA: ${{ inputs.core_ref }}
      PLATFORMS: ${{ inputs.platform_integrities }}
    steps:
      - name: Require an immutable source commit
        run: '[[ "$CORE_SHA" =~ ^[a-f0-9]{40}$ ]]'
      - name: Check out release files
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          path: wrapper
          persist-credentials: false
      - name: Check out private core
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          repository: dztabel-happy/diagramkit-cli-core
          ref: ${{ inputs.core_ref }}
          path: core
          ssh-key: ${{ secrets.CORE_DEPLOY_KEY }}
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "22.16.0"
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Verify the pair and prepare the build
        working-directory: core
        run: |
          test "$(git rev-parse HEAD)" = "$CORE_SHA"
          test "$(git -C ../wrapper rev-parse HEAD)" = "$GITHUB_SHA"
          node scripts/sync-public.mjs --check ../wrapper
          npm ci --no-audit --no-fund >"$RUNNER_TEMP/dependencies.log" 2>&1
          python -m pip install --quiet -r requirements-fonts.txt >"$RUNNER_TEMP/python.log" 2>&1
          python scripts/fonts.py >"$RUNNER_TEMP/fonts.log" 2>&1
          python scripts/fonts.py --check >>"$RUNNER_TEMP/fonts.log" 2>&1
      - name: Build and check the actual tarball
        working-directory: core
        run: |
          python scripts/pack-release.py ../packed >"$RUNNER_TEMP/pack.json" 2>"$RUNNER_TEMP/build.log"
          jq -e --arg core "$CORE_SHA" --arg wrapper "$GITHUB_SHA" --argjson platforms "$PLATFORMS" \
            'select(($platforms | keys) == ["darwin-arm64","win32-arm64","win32-x64"] and
                    all($platforms[]; test("^sha512-[A-Za-z0-9+/]{86}==$"))) | .[0] | select(.name == "@dztabel/diagramkit") | {core:$core, wrapper:$wrapper, platforms:$platforms, name, version, filename, integrity}' \
            "$RUNNER_TEMP/pack.json" > ../packed/candidate.json
          cat ../packed/candidate.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: candidate
          path: |
            packed/*.tgz
            packed/candidate.json
          if-no-files-found: error
          retention-days: 2

  smoke:
    needs: build
    name: Cold install and render on ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel, windows-latest, windows-11-arm, ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "22.16.0"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: candidate
          path: packed
      - name: Install the same tarball, load the skill and draw
        run: |
          (cd packed && node -e 'const m=require("./candidate.json"); if ("sha512-"+require("crypto").createHash("sha512").update(require("fs").readFileSync(m.filename)).digest("base64")!==m.integrity) process.exit(1)')
          mkdir consumer && cd consumer
          npm init -y > /dev/null
          npm install --cache ./npm-cache --registry=https://registry.npmjs.org --no-audit --no-fund ../packed/*.tgz
          npx --no-install diagramkit --version
          npx --no-install diagram-kit --version
          node ../.github/scripts/smoke.mjs
      - name: Exercise the Linux musl native runtime on the same architecture
        if: runner.os == 'Linux'
        run: |
          docker run --rm --workdir /consumer -v "$PWD/packed:/packed:ro" -v "$PWD/.github/scripts:/checks:ro" \
            node:22.16.0-alpine@sha256:41e4389f3d988d2ed55392df4db1420ad048ae53324a8e2b7c6d19508288107e \
            sh -ec 'apk add --no-cache fontconfig >/dev/null; npm init -y >/dev/null; npm install --no-audit --no-fund /packed/*.tgz; node /checks/smoke.mjs'

  rehearse:
    needs: smoke
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "22.16.0"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: candidate
          path: packed
      - name: Check version availability and rehearse publication
        run: |
          version=$(jq -er .version packed/candidate.json)
          curl -fsSL 'https://registry.npmjs.org/@dztabel%2fdiagramkit' | jq -e --arg v "$version" '.versions | has($v) | not'
          npm publish ./packed/*.tgz --access public --dry-run
      - name: Retain the rehearsed archive for promotion
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rehearsed-package
          path: |
            packed/*.tgz
            packed/candidate.json
          if-no-files-found: error
          retention-days: 14

  registry-platform:
    permissions:
      actions: read
      contents: read
    if: inputs.publish == 'true' || inputs.publish == 'verify'
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: macos-15, target: darwin-arm64, arch: arm64}
          - {runner: windows-latest, target: win32-x64, arch: x64}
          - {runner: windows-11-arm, target: win32-arm64, arch: arm64}
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Require the successful rehearsal of this workflow
        env:
          GH_TOKEN: ${{ github.token }}
          RUN: ${{ inputs.rehearsal_run_id }}
          CORE: ${{ inputs.core_ref }}
        run: |
          [[ "$RUN" =~ ^[0-9]+$ && "$CORE" =~ ^[0-9a-f]{40}$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN" |
            jq -e --arg sha "$GITHUB_SHA" 'select(.head_sha == $sha and .conclusion == "success" and .event == "workflow_dispatch" and .path == ".github/workflows/release.yml")' >/dev/null
      # Git for Windows can read the deploy key from an agent without creating a key file on NTFS.
      - name: Check out native acceptance scripts on Windows
        if: runner.os == 'Windows'
        env:
          DEPLOY_KEY: ${{ secrets.CORE_DEPLOY_KEY }}
          CORE: ${{ inputs.core_ref }}
        run: |
          eval "$(/usr/bin/ssh-agent -s)" >/dev/null
          trap '/usr/bin/ssh-agent -k >/dev/null' EXIT
          printf '%s\n' "$DEPLOY_KEY" | /usr/bin/ssh-add - >/dev/null
          unset DEPLOY_KEY
          hosts=$(mktemp)
          curl -fsSL https://api.github.com/meta | jq -er '.ssh_keys[] | "github.com " + .' > "$hosts"
          export GIT_SSH_COMMAND="/usr/bin/ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile='$hosts'"
          git init -q
          git remote add origin git@github.com:dztabel-happy/diagramkit-cli-core.git
          git sparse-checkout set scripts/offline
          git fetch --no-tags --depth=1 --filter=blob:none origin "$CORE"
          git checkout --quiet --detach FETCH_HEAD
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        if: runner.os != 'Windows'
        with:
          repository: dztabel-happy/diagramkit-cli-core
          ref: ${{ inputs.core_ref }}
          ssh-key: ${{ secrets.CORE_DEPLOY_KEY }}
          sparse-checkout: scripts/offline
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: rehearsed-package
          path: rehearsed
          run-id: ${{ inputs.rehearsal_run_id }}
          github-token: ${{ github.token }}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: "3.12"
          architecture: ${{ matrix.arch }}
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: "22.16.0"
      - name: Bind the native test code to the rehearsed source
        env:
          CORE: ${{ inputs.core_ref }}
        run: |
          test "$(git rev-parse HEAD)" = "$CORE"
          jq -e --arg sha "$CORE" '.core == $sha' rehearsed/candidate.json
      - name: Fetch exact registry bytes anonymously using a fresh cache
        run: python scripts/offline/registry.py rehearsed/candidate.json ${{ matrix.target }} official
      - name: Enable Windows firewall
        if: runner.os == 'Windows'
        shell: powershell
        run: Set-NetFirewallProfile -Profile Domain,Private,Public -Enabled True
      - name: Offline native Chinese render, skill and source verification
        run: python scripts/offline/verify.py --npm official ${{ matrix.target }} accept

  publish:
    needs: registry-platform
    name: ${{ inputs.publish == 'verify' && 'Verify official npm package' || 'Publish rehearsed package' }}
    if: inputs.publish == 'true' || inputs.publish == 'verify'
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
    env:
      CORE_SHA: ${{ inputs.core_ref }}
      REHEARSAL: ${{ inputs.rehearsal_run_id }}
    steps:
      - name: Identify the successful rehearsal and pin its public commit
        id: rehearsal
        env:
          GH_TOKEN: ${{ github.token }}
          MODE: ${{ inputs.publish }}
        run: |
          [[ "$CORE_SHA" =~ ^[a-f0-9]{40}$ && "$REHEARSAL" =~ ^[0-9]+$ ]]
          wrapper=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$REHEARSAL" |
            jq -er --arg repo "$GITHUB_REPOSITORY" '
              select(.conclusion == "success" and .event == "workflow_dispatch" and
                     .path == ".github/workflows/release.yml" and .head_repository.full_name == $repo) | .head_sha')
          [[ "$wrapper" =~ ^[a-f0-9]{40}$ ]]
          if [[ "$MODE" == "true" ]]; then
            test "$wrapper" = "$GITHUB_SHA"
          fi
          echo "wrapper=$wrapper" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: rehearsed-package
          path: packed
          run-id: ${{ inputs.rehearsal_run_id }}
          github-token: ${{ github.token }}
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: "22.16.0"
          registry-url: https://registry.npmjs.org
      - name: Match both commits and check the archive integrity
        working-directory: packed
        env:
          WRAPPER_SHA: ${{ steps.rehearsal.outputs.wrapper }}
        run: |
          jq -e --arg core "$CORE_SHA" --arg wrapper "$WRAPPER_SHA" \
            '.core == $core and .wrapper == $wrapper and .name == "@dztabel/diagramkit" and .filename == ("dztabel-diagramkit-" + .version + ".tgz")' candidate.json
          node -e 'const m=require("./candidate.json"); if ("sha512-"+require("crypto").createHash("sha512").update(require("fs").readFileSync(m.filename)).digest("base64")!==m.integrity) process.exit(1)'
      - name: Publish the rehearsed tarball
        if: inputs.publish == 'true'
        working-directory: packed
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish "./$(jq -er .filename candidate.json)" --access public --tag latest
      - name: Wait for official latest and download the verified tarball
        working-directory: packed
        timeout-minutes: 16
        run: |
          for attempt in {1..60}; do
            if curl -fsSL 'https://registry.npmjs.org/@dztabel%2fdiagramkit' -o "$RUNNER_TEMP/registry.json" &&
              url=$(jq -er --slurpfile m candidate.json '
                select(.["dist-tags"].latest == $m[0].version) | .versions[$m[0].version].dist |
                select(.integrity == $m[0].integrity) | .tarball' "$RUNNER_TEMP/registry.json") &&
              curl -fsSL "$url" -o "$RUNNER_TEMP/official.tgz"; then
              cmp "$(jq -er .filename candidate.json)" "$RUNNER_TEMP/official.tgz"
              exit 0
            fi
            sleep 15
          done
          exit 1
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          path: wrapper
          ref: ${{ steps.rehearsal.outputs.wrapper }}
          persist-credentials: false
      - name: Cold install from official npm and render again
        run: |
          mkdir installed && cd installed
          npm init -y > /dev/null
          npm install --cache ./npm-cache --registry=https://registry.npmjs.org --no-audit --no-fund "@dztabel/diagramkit@$(jq -er .version ../packed/candidate.json)"
          node -e 'const m=require("../packed/candidate.json"), p=require("./package-lock.json").packages["node_modules/@dztabel/diagramkit"]; if(p.version!==m.version||p.integrity!==m.integrity)process.exit(1)'
          npx --no-install diagramkit --version
          npx --no-install diagram-kit --version
          node ../wrapper/.github/scripts/smoke.mjs
